name: Scrape dining hall menus

on:
  schedule:
    # GitHub cron is in UTC: 13:17 UTC = 5:17am Pacific in winter, 6:17am in summer.
    - cron: "17 13 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

concurrency:
  group: scrape-menus
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SODEXO_API_KEY: ${{ secrets.SODEXO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        id: install
        run: pip install -r requirements.txt

      # menu_database.py runs all three scrapers, standardizes their rows and
      # uploads them. One broken scraper doesn't stop the others; the run is
      # still marked failed so you notice.
      - name: Scrape and upload all halls
        run: python scraper/menu_database.py
